# Simulator Configuration Properties
# Based on paper default parameters (Table: Default configuration parameters)

# Model Configuration
# totalModels=3: the minimum that keeps every CPR topology distinct (n=2 collapses
# FAN_OUT/RING/UNIFORM into the same 2-cycle) and satisfies semanticOverlap>0 requiring >=2 models.
simulator.totalModels=3
simulator.totalResources=5000
simulator.ioTimePerResource=200000
simulator.cpuTimePerResource=100000
simulator.lockIOTimePerResource=200000
simulator.lockCPUTimePerResource=100000

# Transaction Configuration
simulator.initialTransactions=200
simulator.totalTransactionSteps=10000
simulator.maxTransactionModels=5
simulator.maxTransactionResources=50

# CPR / Bookkeeper Configuration
simulator.semanticOverlap=0.05
simulator.maxCprsPerResource=1
simulator.avgCprsPerResource=1.0

# Simulation Runtime Configuration
simulator.simulationDurationSeconds=10000
simulator.numberOfIoProcessors=30
simulator.numberOfCpuProcessors=30
simulator.totalLocks=200
